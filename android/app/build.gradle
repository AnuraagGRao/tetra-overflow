plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.tetraoverflow.ultra'
    compileSdk 34
    
    lint {
        disable 'MissingTranslation'
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.tetraoverflow.ultra"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.8.2"

        manifestPlaceholders = [
            hostName: "tetra.anuraaggrao.com",
            defaultUrl: "https://tetra.anuraaggrao.com/",
            launchUrl: "https://tetra.anuraaggrao.com/",
            assetStatements: "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://tetra.anuraaggrao.com\\\"}}]",
            fileProviderAuthority: "com.tetraoverflow.ultra.fileprovider"
        ]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            manifestPlaceholders.fileProviderAuthority = "com.tetraoverflow.ultra.debug.fileprovider"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
